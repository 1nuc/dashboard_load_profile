---
- name: Load Profile Decomposition Deployment
  gather_facts: true
  hosts: load_profile-server

  vars:
    project_file: "/home/ahmedthegoat/dashboard_load_profile"
    private_key: '/home/ahmedthegoat/.ssh/deployment'
    repo_url: 'https://github.com/1nuc/dashboard_load_profile'

  tasks:
    - name: Install Required builds
      ansible.builtin.apt:
        name:
          - curl
          - python3-paramiko
          - snapd
          - git
          - caddy
        state: present
        update_cache: yes
      become: true

    - name: Remove existing Node.js completely
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
        state: absent
        purge: yes
      become: true

    - name: Remove leftover node binaries
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/bin/node
        - /usr/bin/nodejs
        - /usr/bin/npm
        - /usr/local/bin/node
        - /usr/local/bin/npm
      become: true
      ignore_errors: true

    - name: Add NodeSource repository and install Node.js
      ansible.builtin.shell: |
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      become: true

    - name: Install Node.js 22 from NodeSource
      ansible.builtin.apt:
          name: nodejs
          state: present
          update_cache: yes
      become: true

    - name: Define Public Keys for github
      ansible.builtin.known_hosts:
        name: github.com
        key: "{{ item }}"
        path: ~/.ssh/known_hosts
        state: present
      loop: "{{ known_hosts }}"

    - name: Copy ssh private to the machine
      ansible.builtin.copy:
        src: '~/.ssh/deployment'
        dest: '{{ private_key }}'
        owner: ahmedthegoat
        group: ahmedthegoat
        mode: 0600

    - name: Copy ssh public to the machine
      ansible.builtin.copy:
        src: '~/.ssh/deployment.pub' 
        dest: '~/.ssh/deployment.pub'
        owner: ahmedthegoat
        group: ahmedthegoat
        mode: 0644

    - name: configure ssh keys for cloning repositories
      community.general.ssh_config:
        user: ahmedthegoat 
        host: github.com 
        hostname: github.com
        identity_file: '{{ private_key }}'
        state: present
        strict_host_key_checking: true
        user_known_hosts_file: ~/.ssh/known_hosts

    - name: Clone Repository
      ansible.builtin.git:
        repo: '{{ repo_url }}'
        dest:  '{{ project_file }}'
        clone: true
        update: yes 
        force: yes
        depth: 1
        version: main

    - name: clean npm cache
      ansible.builtin.command: npm cache clean --force
      args:
        chdir: "{{ project_file }}"

    - name: clean previous dist folder
      ansible.builtin.file:
        path: "{{ project_file }}/dist"
        state: absent

    - name: Install required dependencies
      ansible.builtin.command: npm install 
      args:
        chdir: "{{ project_file }}"
      become: true

    - name: Install React builder serve
      ansible.builtin.command: npm install serve
      args:
        chdir: "{{ project_file }}"
      become: true
    - name: building the dashboard for production
      ansible.builtin.command: npm run build 
      args:
        chdir: "{{ project_file }}" 

    - name: Remove Old contents of the www browser
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ lookup('ansible.builtin.fileglob', '/var/www/dashboard/dist/*', wantlist=True) }}"

    - name: Ensure browser folder exists 
      ansible.builtin.file:
        path: /var/www/dashboard/dist
        state: directory
        owner: www-data
        group: www-data
        mode: '0775'
        recurse: yes
      become: true
      tags:
      - browser

    - name: copy the browser build
      ansible.builtin.command: rsync -av --delete "/home/ahmedthegoat/dashboard_load_profile/dist/" "/var/www/dashboard/dist/"
      become: true


    - name: Copy Caddy Configuration 
      ansible.builtin.copy:
        src: 'Caddyfile'
        dest: '/etc/caddy/'
        mode: 0700
      become: true

    - name: Starting and enabling caddy 
      ansible.builtin.systemd_service:
        name: nginx 
        state: reloaded 
        enabled: true

    - name: install docker
      community.general.snap:
        name: docker
        state: present 
      become: true

    - name: create a custom docker network 
      community.docker.docker_network:
        name: load-profile-net
      become: true
    
    # backend container
    - name: get containers info
      community.docker.docker_container_info:
        name: api-container
      register: backend_container
      tags:
        - info
      become: true
    # Stop the running container
    - name: Stop the backend running container
      community.docker.docker_container:
        name: api-container
        state: stopped
      when: backend_container.exists == true
      become: true
    # Delete the container
    - name: Delete backend container
      community.docker.docker_container:
        name: api-container
        state: absent
      become: true
    # Delete the image
    - name: Delete the backend image
      community.docker.docker_image:
        state: absent
        name: api 
      become: true

    - name: Rebuilding the docker image
      community.docker.docker_image:
        name: api
        build:
          path: '{{ project_file }}/api'  
          dockerfile: 'Dockerfile'
        source: build
      become: true
    # Rebuild the backend container
    - name: Rebuiding backend container
      community.docker.docker_container:
        name: api-container
        image: api
        state: started
        restart_policy: always
        networks:
          - name: bridge
          - name: load-profile-net
        ports:
          - '8080:8080'
      become: true
